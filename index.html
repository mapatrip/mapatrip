<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapaTrip - Roteiros pelas Américas</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --text-light: #475569;
            --accent: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--card); max-width: 500px; width: 100%; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05); }
        h1 { font-size: 32px; margin-bottom: 8px; text-align: center; color: var(--primary); font-weight: 800; }
        p.subtitle { text-align: center; color: var(--text-light); margin-bottom: 35px; font-size: 15px; line-height: 1.4; }
        .form-group { margin-bottom: 22px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select { width: 100%; padding: 13px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; transition: all 0.3s; background: #f8fafc; }
        input:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-option { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        .radio-option input { width: auto; cursor: pointer; }
        button { width: 100%; padding: 15px; background-color: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 15px; }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="container">
    <h1>MapaTrip 🌎</h1>
    <p class="subtitle">Roteiros inteligentes e personalizados para <strong>qualquer lugar das Américas</strong> (Sul, Central e Norte)</p>
    
    <div class="form-group">
        <label for="destino">Qual cidade das Américas você vai visitar?</label>
        <input type="text" id="destino" placeholder="Ex: Buenos Aires, Cusco, Nova York, Rio...">
    </div>
    
    <div class="form-group">
        <label for="dias">Quantos dias de viagem?</label>
        <input type="number" id="dias" min="1" max="30" value="5">
    </div>
    
    <div class="form-group">
        <label for="estilo">Qual o estilo da trip?</label>
        <select id="estilo">
            <option value="Cultural, Histórico e Museus">Cultural e Museus</option>
            <option value="Gastronômico (focado em comidas locais e restaurantes imperdíveis)">Gastronômico</option>
            <option value="Natureza, Ecoturismo e Aventura">Natureza e Aventura</option>
            <option value="Econômico (Mochilão de baixo custo)">Econômico / Mochilão</option>
            <option value="Romântico / Casal">Romântico / Casal</option>
        </select>
    </div>

    <div class="form-group">
        <label>Escolha sua Inteligência Artificial favorita:</label>
        <div class="radio-group">
            <label class="radio-option">
                <input type="radio" name="ia-choice" value="chatgpt" checked> ChatGPT
            </label>
            <label class="radio-option">
                <input type="radio" name="ia-choice" value="gemini"> Gemini
            </label>
        </div>
    </div>
    
    <button onclick="gerarRoteiroGlobal()">Gerar Roteiro com IA 🚀</button>
</div>

<script>
    function gerarRoteiroGlobal() {
        const destino = document.getElementById('destino').value.trim();
        const dias = document.getElementById('dias').value;
        const estilo = document.getElementById('estilo').value;
        const iaSelecionada = document.querySelector('input[name="ia-choice"]:checked').value;

        if (!destino) {
            alert("Por favor, digite uma cidade das Américas!");
            return;
        }

        // Criamos o prompt perfeito e super complexo que vai mandar para a IA
        const promptTexto = `Atue como um guia de turismo nativo e especialista em ${destino}. Crie um roteiro de viagem hiper-detalhado de ${dias} dias focado no estilo ${estilo}.\n\n` +
                            `Instruções obrigatórias para o roteiro:\n` +
                            `1. Divida cada dia detalhadamente em Manhã, Tarde e Noite.\n` +
                            `2. Agrupe atrações que fiquem próximas geograficamente para otimizar o deslocamento a pé ou transporte público.\n` +
                            `3. Inclua nomes de restaurantes reais locais, pratos típicos que preciso provar e estimativas de custos ou dicas de segurança.\n` +
                            `4. Adicione uma 'Dica de Ouro' valiosa para economizar ou evitar filas em cada dia.\n\n` +
                            `Monte o itinerário completo de forma fluida e amigável.`;

        // Codifica o texto para o formato de link da internet
        const promptCodificado = encodeURIComponent(promptTexto);
        let linkFinal = "";

        // Redireciona de acordo com a preferência do usuário
        if (iaSelecionada === "chatgpt") {
            linkFinal = `https://chatgpt.com/?q=${promptCodificado}`;
        } else {
            linkFinal = `https://gemini.google.com/app?prompt=${promptCodificado}`;
        }

        // Abre a IA na tela do usuário com o comando já digitado!
        window.open(linkFinal, '_blank');
    }
</script>

</body>
</html>
