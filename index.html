<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapaTrip - Roteiros Personalizados</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--card); max-width: 500px; width: 100%; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        h1 { font-size: 28px; margin-bottom: 8px; text-align: center; color: var(--primary); }
        p.subtitle { text-align: center; color: var(--text-light); margin-bottom: 30px; font-size: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        button { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: var(--primary-hover); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 450px; width: 100%; text-align: center; }
        .modal-content h3 { margin-bottom: 12px; color: var(--text); }
        .modal-content p { color: var(--text-light); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .copy-btn { background-color: #10b981; }
        .copy-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h1>MapaTrip ✈️</h1>
    <p class="subtitle">Monte sua viagem personalizada em segundos</p>
    
    <div class="form-group">
        <label for="destino">Para onde você vai?</label>
        <input type="text" id="destino" placeholder="Ex: Paris, Gramado, Nova York...">
    </div>
    
    <div class="form-group">
        <label for="dias">Quantos dias de viagem?</label>
        <input type="number" id="dias" min="1" max="30" placeholder="Ex: 5">
    </div>
    
    <div class="form-group">
        <label for="estilo">Qual o estilo da trip?</label>
        <select id="estilo">
            <option value="Cultural e Museus">Cultural e Museus</option>
            <option value="Gastronômico">Gastronômico</option>
            <option value="Natureza e Aventura">Natureza e Aventura</option>
            <option value="Econômico/Mochilão">Econômico / Mochilão</option>
            <option value="Romântico / Casal">Romântico / Casal</option>
            <option value="Relaxante / Ritmo Lento">Relaxante / Ritmo Lento</option>
        </select>
    </div>
    
    <button onclick="gerarPrompt()">Gerar Meu Roteiro Mágico</button>
</div>

<div id="promptModal" class="modal">
    <div class="modal-content">
        <h3>Seu roteiro está pronto para ser gerado! ✨</h3>
        <p>Como nosso site é 100% gratuito, clique no botão abaixo para copiar as informações da sua viagem e cole diretamente no nosso chat com o Gemini para ele montar seu roteiro personalizado em segundos.</p>
        <button class="copy-btn" id="btnCopiar" onclick="copiarTexto()">Copiar Comando da Viagem</button>
    </div>
</div>

<script>
    let textoParaCopiar = "";

    function gerarPrompt() {
        const destino = document.getElementById('destino').value;
        const dias = document.getElementById('dias').value;
        const estilo = document.getElementById('estilo').value;

        if(!destino || !dias) {
            alert("Por favor, preencha todos os campos!");
            return;
        }

        textoParaCopiar = `Olá Gemini! Usei o site MapaTrip e quero que você gere um roteiro de viagem personalizado para mim com os seguintes detalhes:\n\n` +
                          `- Destino: ${destino}\n` +
                          `- Duração: ${dias} dias\n` +
                          `- Estilo da Viagem: ${estilo}\n\n` +
                          `Por favor, divida o roteiro em Manhã, Tarde e Noite para cada dia, agrupe atrações que fiquem próximas geograficamente e dê sugestões de locais incríveis.`;

        document.getElementById('promptModal').style.display = 'flex';
    }

    function copiarTexto() {
        navigator.clipboard.writeText(textoParaCopiar).then(() => {
            const btn = document.getElementById('btnCopiar');
            btn.innerText = "✓ Copiado! Pode colar no chat";
            setTimeout(() => {
                document.getElementById('promptModal').style.display = 'none';
                btn.innerText = "Copiar Comando da Viagem";
            }, 2000);
        });
    }
</script>

</body>
</html>
